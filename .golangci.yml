# golangci-lint configuration (v2 schema).
#
# The standard linters check correctness and unused code. Errorlint keeps
# error comparisons working with wrapped errors, misspell checks comments and
# strings, unconvert finds conversions between identical types, and gofmt
# checks source formatting. Staticcheck runs every check except QF1008. Tests are linted like the rest of the code.
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # Explicit selectors through embedded fields read better here.
        - -QF1008

issues:
  # Report all findings from each linter and source line.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
