name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum is the go directive of go.mod.
          - name: go-minimum
            go-version-file: go.mod
            flags: -race
          - name: go-stable
            go-version: stable
            flags: -race
          # 32-bit catches integer conversions that only overflow there.
          - name: linux-386
            go-version: stable
            goarch: '386'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - name: go test
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test ./... ${{ matrix.flags }} -count=1 -timeout 900s
      - name: benchmarks (one iteration each)
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test ./... -run '^$' -bench . -benchtime 1x
      - name: build examples
        working-directory: examples
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          (cd examples && go vet ./...)
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
          (cd examples && "$(go env GOPATH)/bin/staticcheck" ./...)
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: golangci-lint
        run: |
          golangci-lint run ./...
          (cd examples && golangci-lint run ./...)
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          (cd examples && "$(go env GOPATH)/bin/govulncheck" ./...)

  gw-tester:
    name: gw-tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache-dependency-path: examples/go.sum
      - name: attach five subscribers through eNB, MME, SGW and PGW
        run: examples/gw-tester/e2e.sh

  portability:
    name: portability / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: loopback aliases
        if: runner.os == 'macOS'
        run: for a in 2 11 12; do sudo ifconfig lo0 alias "127.0.0.$a"; done
      - name: go test
        run: go test ./... -count=1 -timeout 900s
